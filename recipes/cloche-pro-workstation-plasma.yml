name: cloche-pro-workstation-plasma
description: "Cloche PRO Workstation (PLASMA)"

base-image: ghcr.io/cloche-project/cloche-pro
image-version: latest

modules:

  - type: os-release
    properties:
      #ID: cloche-pro
      NAME: Cloche PRO Workstation
      PRETTY_NAME: Cloche PRO 10 (Lunar Slate)
      HOME_URL: https://github.com/augustofmarques/cloche
      BUG_REPORT_URL: https://github.com/augustofmarques/cloche/issues
      SUPPORT_URL: https://github.com/augustofmarques/cloche
      DEFAULT_HOSTNAME: cloche

  #tuned-ppd is excluded due to a known SELinux bug. It must be excluded from BOTH installs below:
  #powerdevil (pulled in by @KDE) Recommends tuned-ppd, so it sneaks back in during the @KDE
  #install even though the later `tuned` install already excludes it.
  - type: containerfile
    snippets:
      - RUN dnf install -y --allowerasing @KDE --exclude=plasma-workspace-wallpapers --exclude=plasma-discover --exclude=plasma-discover-notifier --exclude=tuned-ppd && dnf clean all
      - |
        RUN dnf install -y --allowerasing --nobest --exclude=tuned-ppd \
          tuned \
          cockpit \
          git \
          distrobox \
          btop \
          newt \
          zsh \
          firefox \
          spice-vdagent \
          qemu-guest-agent \
          plymouth-plugin-script \
          uxplay && \
          dnf clean all
      #CentOS Stream 10's spice-vdagent (0.22.1) predates the upstream switch to wiring its user
      #service into graphical-session.target by default (Fedora's 0.23.0 already does this) — the
      #older build only wants it from plasma-core.target, with no ordering guarantee against the
      #compositor being ready, which is why guest->host clipboard is unreliable. Replicate what the
      #newer package does automatically until CentOS/EPEL catches up.
      - |
        RUN mkdir -p /usr/lib/systemd/user/graphical-session.target.wants && \
          ln -sf ../spice-vdagent.service /usr/lib/systemd/user/graphical-session.target.wants/spice-vdagent.service
      - RUN ln -sf /usr/share/applications/firefox.desktop /usr/share/applications/org.mozilla.firefox.desktop
      - RUN mkdir -p /etc/flatpak/remotes.d && curl -L https://dl.flathub.org/repo/flathub.flatpakrepo -o /etc/flatpak/remotes.d/flathub.flatpakrepo
      - |
        RUN cat > /etc/yum.repos.d/cloche-pro-rpm.repo << 'EOF'
        [cloche]
        name=Cloche Pro RPM Repository
        baseurl=https://cloche-project.github.io/rpm-repo/cloche-pro/$releasever/$basearch/
        enabled=1
        gpgcheck=1
        gpgkey=https://cloche-project.github.io/rpm-repo/RPM-GPG-KEY-cloche
        repo_gpgcheck=0
        metadata_expire=3600
        EOF
      - RUN dnf install -y cloche-kde-defaults plasma-applet-appgrid && dnf clean all
      # /usr/share/backgrounds/default.png is the generic XDG "default wallpaper" convention
      # several things fall back to; keep it pointed at Cloche's own art like cloche-standard
      # does, regardless of what actually consults it here.
      - |
        RUN rm -f /usr/share/backgrounds/default.png /usr/share/backgrounds/default-dark.png && \
          ln -sf /usr/share/wallpapers/Cloche-Default/contents/images/3840x2025.webp /usr/share/backgrounds/default.png && \
          ln -sf /usr/share/wallpapers/Cloche-Default/contents/images/3840x2025-dark.webp /usr/share/backgrounds/default-dark.png
      - "RUN echo '%wheel ALL=(ALL) NOPASSWD: /usr/bin/bootc' > /etc/sudoers.d/99-bootc-nopasswd"
      - "RUN chmod 0440 /etc/sudoers.d/99-bootc-nopasswd"
      - RUN glib-compile-schemas /usr/share/glib-2.0/schemas/
      - RUN curl -sS https://starship.rs/install.sh | sh -s -- --yes

  - type: files
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc

  - type: containerfile
    snippets:
      - RUN fc-cache -f && update-desktop-database /usr/share/applications

  #- type: script
    #scripts:
      #- setup-cloche-pro-plasma.sh

  - type: kargs
    kargs:
      - nowatchdog
      - random.trust_cpu=on
      - console=tty0
      - quiet
      - splash
      - rhgb
      - rd.udev.log_priority=3
      - vt.global_cursor_default=0
      - systemd.show_status=auto

  - type: systemd
    system:
      enabled:
        #- sddm.service
        - NetworkManager.service
        - first-boot-flatpaks.service
        - tuned.service